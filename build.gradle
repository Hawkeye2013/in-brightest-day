plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	maven {
		name = "RedlanceMinecraft"
		url = uri("https://repo.redlance.org/public")
	}
	maven {
		name = "Gegy"
		url = uri("https://maven.gegy.dev/releases/")
	}
	maven {
		name = "TerraformersMC"
		url = uri("https://maven.terraformersmc.com/releases")
	}
	maven {
		name = "BlameJared"
		url = uri("https://maven.blamejared.com")
	}
	maven {
		name = "FzzyMaven"
		url = uri("https://maven.fzzyhmstrs.me")
	}
	maven {
		name = "HenkelMaven"
		url = uri("https://maven.maxhenkel.de/repository/public")
	}
	maven {
		name = "Nucleoid"
		url = uri("https://maven.nucleoid.xyz/")
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "brightestday"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation("com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.pal_version}")
	compileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynamiclights_version}")
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	implementation "me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}"
	compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"

	compileOnly "eu.pb4:placeholder-api:${project.placeholder_version}"
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

base {
	archivesName = "brightestday"
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "${project.release_stage}-${project.version}"
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
